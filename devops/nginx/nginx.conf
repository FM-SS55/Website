# devops/nginx/nginx.conf — host Nginx (non-Docker, e.g. Lightsail + systemd).
# Setup: replace yourdomain.com, then
#   sudo cp devops/nginx/nginx.conf /etc/nginx/sites-available/pulizia
#   sudo ln -s /etc/nginx/sites-available/pulizia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    client_max_body_size 10M;

    # API + uploaded images -> Node (127.0.0.1:3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /images/uploads/ {
        alias /var/www/pulizia-fm/backend/uploads/;
        expires 30d;
        access_log off;
    }

    # Admin SPA (built to frontend/admin/dist/admin)
    location /admin/ {
        root /var/www/pulizia-fm/frontend/admin/dist;
        try_files $uri /admin/index.html;
    }

    # Public SPA
    location / {
        root /var/www/pulizia-fm/frontend/web/dist;
        try_files $uri /index.html;
    }
}