# Gateway used by docker-compose: one public port, routes to the three containers.
server {
    listen 80;
    client_max_body_size 10M;

    location /api/            { proxy_pass http://backend:3000; include /etc/nginx/proxy_params; }
    location /images/uploads/ { proxy_pass http://backend:3000; include /etc/nginx/proxy_params; }
    location /admin/          { proxy_pass http://admin:80;      include /etc/nginx/proxy_params; }
    location /                { proxy_pass http://web:80;        include /etc/nginx/proxy_params; }
}