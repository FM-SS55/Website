services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - db-data:/app/database
      - upload-data:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    restart: unless-stopped

  admin:
    build:
      context: ./frontend
      dockerfile: admin/Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./devops/docker/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./devops/docker/proxy_params:/etc/nginx/proxy_params:ro
    depends_on: [backend, web, admin]
    restart: unless-stopped

volumes:
  db-data:
  upload-data: